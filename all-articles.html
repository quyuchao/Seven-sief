  <!-- 汉堡菜单样式 -->
  <style>
    .burger {
      position: relative;
      width: 40px;
      height: 30px;
      background: transparent;
      cursor: pointer;
      display: block;
    }

    .burger input {
      display: none;
    }

    .burger span {
      display: block;
      position: absolute;
      height: 4px;
      width: 100%;
      background: #1C1C1E;
      border-radius: 9px;
      opacity: 1;
      left: 0;
      transform: rotate(0deg);
      transition: .25s ease-in-out;
    }

    .burger span:nth-of-type(1) {
      top: 0px;
      transform-origin: left center;
    }

    .burger span:nth-of-type(2) {
      top: 50%;
      transform: translateY(-50%);
      transform-origin: left center;
    }

    .burger span:nth-of-type(3) {
      top: 100%;
      transform-origin: left center;
      transform: translateY(-100%);
    }

    .burger input:checked ~ span:nth-of-type(1) {
      transform: rotate(45deg);
      top: 0px;
      left: 5px;
    }

    .burger input:checked ~ span:nth-of-type(2) {
      width: 0%;
      opacity: 0;
    }

    .burger input:checked ~ span:nth-of-type(3) {
      transform: rotate(-45deg);
      top: 28px;
      left: 5px;
    }
  </style>
  
  <!-- 主题切换按钮样式 -->
  <style>
    .theme-switch {
      --toggle-size: 16px;
      /* the size is adjusted using font-size, */
      /* this is not transform scale, */
      /* so you can choose any size */
      --container-width: 5.625em;
      --container-height: 2.5em;
      --container-radius: 6.25em;
      /* radius 0 - minecraft mode :) */
      --container-light-bg: #3D7EAE;
      --container-night-bg: #1D1F2C;
      --circle-container-diameter: 3.375em;
      --sun-moon-diameter: 2.125em;
      --sun-bg: #ECCA2F;
      --moon-bg: #C4C9D1;
      --spot-color: #959DB1;
      --circle-container-offset: calc((var(--circle-container-diameter) - var(--container-height)) / 2 * -1);
      --stars-color: #fff;
      --clouds-color: #F3FDFF;
      --back-clouds-color: #AACADF;
      --transition: .5s cubic-bezier(0, -0.02, 0.4, 1.25);
      --circle-transition: .3s cubic-bezier(0, -0.02, 0.35, 1.17);
    }

    /* 响应式调整 */
    @media (max-width: 640px) {
      .theme-switch {
        --toggle-size: 14px;
      }
    }

    .theme-switch, .theme-switch *, .theme-switch *::before, .theme-switch *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-size: var(--toggle-size);
    }

    .theme-switch__container {
      width: var(--container-width);
      height: var(--container-height);
      background-color: var(--container-light-bg);
      border-radius: var(--container-radius);
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0em -0.062em 0.062em rgba(0, 0, 0, 0.25), 0em 0.062em 0.125em rgba(255, 255, 255, 0.94);
      transition: var(--transition);
      position: relative;
    }

    .theme-switch__container::before {
      content: "";
      position: absolute;
      z-index: 1;
      inset: 0;
      box-shadow: 0em 0.05em 0.187em rgba(0, 0, 0, 0.25) inset, 0em 0.05em 0.187em rgba(0, 0, 0, 0.25) inset;
      border-radius: var(--container-radius)
    }

    .theme-switch__checkbox {
      display: none;
    }

    .theme-switch__circle-container {
      width: var(--circle-container-diameter);
      height: var(--circle-container-diameter);
      background-color: rgba(255, 255, 255, 0.1);
      position: absolute;
      left: var(--circle-container-offset);
      top: var(--circle-container-offset);
      border-radius: var(--container-radius);
      box-shadow: inset 0 0 0 3.375em rgba(255, 255, 255, 0.1), inset 0 0 0 3.375em rgba(255, 255, 255, 0.1), 0 0 0 0.625em rgba(255, 255, 255, 0.1), 0 0 0 1.25em rgba(255, 255, 255, 0.1);
      display: flex;
      transition: var(--circle-transition);
      pointer-events: none;
    }

    .theme-switch__sun-moon-container {
      pointer-events: auto;
      position: relative;
      z-index: 2;
      width: var(--sun-moon-diameter);
      height: var(--sun-moon-diameter);
      margin: auto;
      border-radius: var(--container-radius);
      background-color: var(--sun-bg);
      box-shadow: 0.062em 0.062em 0.062em 0em rgba(254, 255, 239, 0.61) inset, 0em -0.062em 0.062em 0em #a1872a inset;
      filter: drop-shadow(0.062em 0.125em 0.125em rgba(0, 0, 0, 0.25)) drop-shadow(0em 0.062em 0.125em rgba(0, 0, 0, 0.25));
      overflow: hidden;
      transition: var(--transition);
    }

    .theme-switch__moon {
      transform: translateX(100%);
      width: 100%;
      height: 100%;
      background-color: var(--moon-bg);
      border-radius: inherit;
      box-shadow: 0.062em 0.062em 0.062em 0em rgba(254, 255, 239, 0.61) inset, 0em -0.062em 0.062em 0em #969696 inset;
      transition: var(--transition);
      position: relative;
    }

    .theme-switch__spot {
      position: absolute;
      top: 0.75em;
      left: 0.312em;
      width: 0.75em;
      height: 0.75em;
      border-radius: var(--container-radius);
      background-color: var(--spot-color);
      box-shadow: 0em 0.0312em 0.062em rgba(0, 0, 0, 0.25) inset;
    }

    .theme-switch__spot:nth-of-type(2) {
      width: 0.375em;
      height: 0.375em;
      top: 0.937em;
      left: 1.375em;
    }

    .theme-switch__spot:nth-last-of-type(3) {
      width: 0.25em;
      height: 0.25em;
      top: 0.312em;
      left: 0.812em;
    }

    .theme-switch__clouds {
      width: 1.25em;
      height: 1.25em;
      background-color: var(--clouds-color);
      border-radius: var(--container-radius);
      position: absolute;
      bottom: -0.625em;
      left: 0.312em;
      box-shadow: 0.937em 0.312em var(--clouds-color), -0.312em -0.312em var(--back-clouds-color), 1.437em 0.375em var(--clouds-color), 0.5em -0.125em var(--back-clouds-color), 2.187em 0 var(--clouds-color), 1.25em -0.062em var(--back-clouds-color), 2.937em 0.312em var(--clouds-color), 2em -0.312em var(--back-clouds-color), 3.625em -0.062em var(--clouds-color), 2.625em 0em var(--back-clouds-color), 4.5em -0.312em var(--clouds-color), 3.375em -0.437em var(--back-clouds-color), 4.625em -1.75em 0 0.437em var(--clouds-color), 4em -0.625em var(--back-clouds-color), 4.125em -2.125em 0 0.437em var(--back-clouds-color);
      transition: 0.5s cubic-bezier(0, -0.02, 0.4, 1.25);
    }

    .theme-switch__stars-container {
      position: absolute;
      color: var(--stars-color);
      top: -100%;
      left: 0.312em;
      width: 2.75em;
      height: auto;
      transition: var(--transition);
    }

    /* actions */

    .theme-switch__checkbox:checked + .theme-switch__container {
      background-color: var(--container-night-bg);
    }

    .theme-switch__checkbox:checked + .theme-switch__container .theme-switch__circle-container {
      left: calc(100% - var(--circle-container-offset) - var(--circle-container-diameter));
    }

    .theme-switch__checkbox:checked + .theme-switch__container .theme-switch__circle-container:hover {
      left: calc(100% - var(--circle-container-offset) - var(--circle-container-diameter) - 0.187em)
    }

    .theme-switch__circle-container:hover {
      left: calc(var(--circle-container-offset) + 0.187em);
    }

    .theme-switch__checkbox:checked + .theme-switch__container .theme-switch__moon {
      transform: translate(0);
    }

    .theme-switch__checkbox:checked + .theme-switch__container .theme-switch__clouds {
      bottom: -4.062em;
    }

    .theme-switch__checkbox:checked + .theme-switch__container .theme-switch__stars-container {
      top: 50%;
      transform: translateY(-50%);
    }
  </style>

      const now = new Date();
      const options = {
        year: 'numeric',
        month: 'long',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
      };
      const timeString = now.toLocaleString('zh-CN', options);
      
      // 简化的时间格式（用于移动端导航栏）
      const shortOptions = {
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      };
      const shortTimeString = now.toLocaleString('zh-CN', shortOptions);
      
      // 更新桌面端时间
      const timeElement = document.getElementById('current-time');
      if (timeElement) {
        timeElement.textContent = timeString;
      }
      
      // 更新移动端时间
      const mobileTimeElement = document.getElementById('mobile-current-time');
      if (mobileTimeElement) {
        mobileTimeElement.textContent = timeString;
      }
      
      // 更新移动端导航栏时间
      const mobileNavTimeElement = document.getElementById('mobile-nav-time');
      if (mobileNavTimeElement) {
        mobileNavTimeElement.textContent = shortTimeString;
      }

    // 文章功能
    function initArticles() {
      let currentPage = 1;
      const itemsPerPage = 6;
      let currentCategory = 'all';
      let searchTerm = '';
      
      // 渲染文章列表
      function renderArticles() {
        const filteredArticles = articlesData.filter(article => {
          const matchesCategory = currentCategory === 'all' || article.category === currentCategory;
          const matchesSearch = searchTerm === '' || 
            article.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
            article.excerpt.toLowerCase().includes(searchTerm.toLowerCase());
          return matchesCategory && matchesSearch;
        });
        
        const totalPages = Math.ceil(filteredArticles.length / itemsPerPage);
        const startIndex = (currentPage - 1) * itemsPerPage;
        const endIndex = startIndex + itemsPerPage;
        const paginatedArticles = filteredArticles.slice(startIndex, endIndex);
        
        const articlesContainer = document.getElementById('articles-container');
        articlesContainer.innerHTML = '';
        
        if (paginatedArticles.length === 0) {
          articlesContainer.innerHTML = `
            <div class="text-center py-12">
              <i class="fa fa-search text-4xl text-dark-light mb-4"></i>
              <h3 class="text-xl font-semibold text-dark mb-2">没有找到匹配的文章</h3>
              <p class="text-dark-light">尝试使用不同的搜索词或分类。</p>
            </div>
          `;
        } else {
          paginatedArticles.forEach((article, index) => {
            const articleCard = document.createElement('div');
            articleCard.className = 'article-card bg-white rounded-xl shadow-lg overflow-hidden hover-scale animate-fade-in-up';
            articleCard.style.animationDelay = `${index * 0.1}s`;
            articleCard.innerHTML = `
              <div class="md:flex">
                <div class="md:w-1/3">
                  <img src="${article.image}" alt="${article.title}" class="w-full h-48 md:h-full object-cover transition-transform duration-500 hover:scale-105">
                </div>
                <div class="p-6 md:w-2/3">
                  <div class="mb-4">
                    <span class="article-tag bg-primary/10 text-primary hover:bg-primary hover:text-white transition-all">${article.category.charAt(0).toUpperCase() + article.category.slice(1)}</span>
                  </div>
                  <h3 class="text-xl font-semibold text-dark mb-3 hover:text-primary transition-colors cursor-pointer">${article.title}</h3>
                  <p class="text-dark-light mb-6">${article.excerpt}</p>
                  <div class="flex flex-wrap gap-4 article-meta mb-4">
                    <span class="flex items-center"><i class="fa fa-calendar mr-2 text-primary"></i> ${article.date}</span>
                    <span class="flex items-center"><i class="fa fa-clock-o mr-2 text-primary"></i> ${article.readTime}</span>
                  </div>
                  <div class="flex flex-wrap gap-2">
                    ${article.tags.map(tag => `<span class="text-xs bg-light px-3 py-1.5 rounded-full hover:bg-primary/10 transition-all">${tag}</span>`).join('')}
                  </div>
                </div>
              </div>
            `;
            articlesContainer.appendChild(articleCard);
          });
        }
        
        renderPagination(totalPages);
      }
      
      // 渲染分页
      function renderPagination(totalPages) {
        const paginationContainer = document.getElementById('pagination');
        paginationContainer.innerHTML = '';
        
        if (totalPages <= 1) return;
        
        // 上一页按钮
        const prevButton = document.createElement('button');
        prevButton.className = 'pagination-btn px-5 py-3 rounded-lg border border-light-dark mr-3 hover-scale transition-all';
        prevButton.disabled = currentPage === 1;
        prevButton.innerHTML = '<i class="fa fa-chevron-left mr-2"></i> 上一页';
        prevButton.addEventListener('click', () => {
          if (currentPage > 1) {
            currentPage--;
            renderArticles();
          }
        });
        paginationContainer.appendChild(prevButton);
        
        // 页码按钮
        for (let i = 1; i <= totalPages; i++) {
          const pageButton = document.createElement('button');
          pageButton.className = `pagination-btn px-5 py-3 rounded-lg border border-light-dark mx-1 ${currentPage === i ? 'active' : ''} hover-scale transition-all`;
          pageButton.textContent = i;
          pageButton.addEventListener('click', () => {
            currentPage = i;
            renderArticles();
          });
          paginationContainer.appendChild(pageButton);
        }
        
        // 下一页按钮
        const nextButton = document.createElement('button');
        nextButton.className = 'pagination-btn px-5 py-3 rounded-lg border border-light-dark ml-3 hover-scale transition-all';
        nextButton.disabled = currentPage === totalPages;
        nextButton.innerHTML = '下一页 <i class="fa fa-chevron-right ml-2"></i>';
        nextButton.addEventListener('click', () => {
          if (currentPage < totalPages) {
            currentPage++;
            renderArticles();
          }
        });
        paginationContainer.appendChild(nextButton);
      }
      
      // 搜索功能
      const searchInput = document.getElementById('search-input');
      searchInput.addEventListener('input', (e) => {
        searchTerm = e.target.value;
        currentPage = 1;
        renderArticles();
      });
      
      // 分类筛选
      const categoryFilters = document.querySelectorAll('.category-filter');
      categoryFilters.forEach(filter => {
        filter.addEventListener('click', () => {
          categoryFilters.forEach(f => f.classList.remove('active'));
          filter.classList.add('active');
          currentCategory = filter.dataset.category;
          currentPage = 1;
          renderArticles();
        });
      });
      
      // 初始化渲染
      renderArticles();
    }
    
    // 平滑滚动优化
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function(e) {
        e.preventDefault();
        const targetId = this.getAttribute('href');
        if (targetId === '#') return;
        const target = document.querySelector(targetId);
        if (target) {
          target.scrollIntoView({
            behavior: 'smooth',
            block: 'start'
          });
          // 更新 URL 但不触发滚动
          history.pushState(null, null, targetId);
        }
      });
    });

    // 返回顶部按钮
    const backToTopBtn = document.getElementById('back-to-top');
    if (backToTopBtn) {
      window.addEventListener('scroll', function() {
        if (window.scrollY > 500) {
          backToTopBtn.classList.remove('opacity-0', 'invisible');
          backToTopBtn.classList.add('opacity-100', 'visible');
        } else {
          backToTopBtn.classList.add('opacity-0', 'invisible');
          backToTopBtn.classList.remove('opacity-100', 'visible');
        }
      });

      backToTopBtn.addEventListener('click', function() {
        window.scrollTo({
          top: 0,
          behavior: 'smooth'
        });
      });
    }

    // 页面访问统计
    function updatePageViews() {
      const pageViewsElement = document.getElementById('page-views');
      if (pageViewsElement) {
        let pageViews = parseInt(localStorage.getItem('pageViews')) || 0;
        pageViews++;
        localStorage.setItem('pageViews', pageViews);
        pageViewsElement.textContent = pageViews;
      }
    }

    // 初始化页面访问统计
    updatePageViews();
  </script>
